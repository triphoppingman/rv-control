[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rv-control"
version = "0.1.0"
description = "Publish RV-C, Renogy, and Hughes Power Watchdog telemetry to MQTT."
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "paho-mqtt>=2.0",
  "python-can>=4.3",
  "ruamel.yaml>=0.18",
  "bleak>=0.22",
  "pytest>=8.0",
]

[project.scripts]
rv-control = "rv_control.cli:cli"
rvcontrol = "rv_control.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rv_control = ["data/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]