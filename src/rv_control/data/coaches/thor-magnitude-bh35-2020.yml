# Coach-specific semantic mappings for a 2020 Thor Motor Coach Magnitude BH35.
# A command selects a transport first; the transport-specific section then
# contains only the fields needed by that transport implementation.
coach:
  manufacturer: Thor Motor Coach
  model: Magnitude BH35
  model_year: 2020

commands:
  livingroom_lights:
    description: Living room lighting group
    transport: rvc
    config_section: rv_c_bus
    rvc:
      command: dc_dimmer_command_2
      dgn: 0x1FEDB
      instance: 1
      group: 1
      defaults:
        level: 100
        delay: 0
        interlock: 0
    actions:
      on:
        command: on
      off:
        command: off
      toggle:
        command: toggle
      brightness:
        command: set-brightness

