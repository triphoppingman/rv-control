[target]
enabled-targets = mqtt, store

[mqtt]
type = mqtt
host = localhost
port = 1883
username =
password =
base_topic = rv
qos = 0
retain = false
write_enabled = false

[store]
type = store
directory = data
filename = state.json
flush_interval = 1

[log]
# Add to enabled-targets to log every topic/payload (debugging; stores nothing)
type = log
level = INFO

[source]
enabled-sources = rv_c_bus, renogy_controller, hughes_power_watchdog

[rv_c_bus]
type = rvc
interface = can0
specfile = src/rv_control/data/rvc-spec.yml
topic = rvc
parameterized_strings = true
interrogate_seconds = 10
write_enabled = false

[renogy_controller]
type = renogy
device-type = RNG_CTRL
adapter = hci0
mac_addr = 10:CA:BF:XX:XX:XX
alias = BT-TH-BFAXXXXXX
device_id = 255
max_retry = 3
reconnect_delay =
max_reconnect_delay =
discovery_timeout = 5
reconnect_jitter = 0.1
persistent_connection =
enable_polling = false
poll_interval = 60
read_timeout = 15
request_interval = 0.5
write_settle_delay = 0.5
temperature_unit = F
fields =
topic = renogy
write_enabled = false

[hughes_power_watchdog]
type = hughes
adapter = hci0
address = 40:79:12:XX:XX:XX
name = PMD      XXXXXXXXX
circuit_amps = 30
max_retry =
reconnect_delay =
max_reconnect_delay =
notification_timeout = 60
connect_settle_delay = 2
persistent_connection =
topic = hughes
write_enabled = false

[gpsd]
type = gpsd
host = localhost
port = 2947
timeout = 5
topic = gpsd

[wled_patio]
type = wled
base_url = http://wled.local
timeout = 5
poll_interval = 60
topic = wled/patio
write_enabled = false

[obd_engine]
type = obd
adapter = hci0
address = 00:1D:A5:XX:XX:XX
channel = 1
header = 7E0
protocol = 0
fallback_protocol = 6
poll_hz = 2
connect_timeout = 10
read_timeout = 5
max_failed_cycles = 3
reconnect_delay = 2
max_reconnect_delay = 60
max_retry =
topic = obd
pid.egt11 = 22, F478, ((b0*256+b1)*0.18)-40, °F
pid.rpm = 01, 0C, (b0*256+b1)/4, RPM
pid.coolant_temp = 01, 05, (b0-40)*1.8+32, °F
pid.tft = 22, 1E1C, ((b0-256 if b0>=128 else b0)*256+b1)*(9/80)+32, °F, 7E1
pid.eot = 22, 1310, (((b0*256+b1)/100)+40)*(9/5)+32, °F
pid.baro = 01, 33, b0/100, bar
pid.boost = 22, 1440, (b0*256+b1)*0.03625-BARO*14.5038, PSI
pid.load = 01, 04, b0/2.55-50, %%
pid.iat = 01, 0F, b0-40, °F
pid.vgt = 22, 096D, b0/2.55, %%
pid.speed = 01, 0D, b0/1.609344, MPH
pid.fuel = 22, F42F, b0*0.39216, %%
pid.volt = 01, 42, (b0*256+b1)/1000, V
pid.gear = 22, 1E12, b0, , 7E1
pid.fipw = 22, 1410, (b0*256+b1)*0.008, ms
pid.icp = 22, 1430, (b0*256+b1)/2, PSI
pid.app = 01, 41, b0/2.55, %%
pid.ambient = 22, F446, b0-40, °F
pid.iat2 = 22, F45B, b0-40, °F
pid.tcc = 22, 1E23, b0, , 7E1

[coach]
specfile = src/rv_control/coaches/thor-magnitude-bh35-2020.yml
rvc = rv_c_bus
wled = wled_patio

[service]
daemon_mode = true
reconnect_delay = 10
max_retry = 0
max_reconnect_delay = 300