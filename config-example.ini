[mqtt]
host = localhost
port = 1883
username =
password =
base_topic = rv
qos = 0
retain = false
write_enabled = false

[source]
enabled-sources = rv_c_bus, renogy_controller, hughes_power_watchdog

[rv_c_bus]
type = rvc
interface = can0
specfile = src/rv_control/data/rvc-spec.yml
topic = rvc
parameterized_strings = true
interrogate_seconds = 10
write_enabled = false

[renogy_controller]
type = renogy
device-type = RNG_CTRL
adapter = hci0
mac_addr = 10:CA:BF:XX:XX:XX
alias = BT-TH-BFAXXXXXX
device_id = 255
max_retry = 3
persistent_connection =
enable_polling = false
poll_interval = 60
temperature_unit = F
fields =
topic = renogy
write_enabled = false

[hughes_power_watchdog]
type = hughes
adapter = hci0
address = 40:79:12:XX:XX:XX
name = PMD      XXXXXXXXX
persistent_connection =
topic = hughes
write_enabled = false

[wled_patio]
type = wled
base_url = http://wled.local
timeout = 5
poll_interval = 60
topic = wled/patio
write_enabled = false

[coach]
specfile = src/rv_control/coaches/thor-magnitude-bh35-2020.yml
rvc = rv_c_bus
wled = wled_patio

[service]
daemon_mode = true
reconnect_delay = 10
max_retry = 0
max_reconnect_delay = 300